- name: check number
  hosts: localhost
  vars_prompt:
    - name: NUMBER
      prompt: please enter number
      private: no

  tasks: 
  - name: number is lessthan 10
    ansible.builtin.debug:
      msg: "Given number is {{NUMBER}} lessthan 10"
    when: number |int < 10

  - name: number is greater than 10
    ansible.builtin.debug:
      msg: "Given number is {{NUMBER}} greaterthan 10"
    when: number |int > 10